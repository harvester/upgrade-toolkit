{{- if .Values.webhook.enable }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
    annotations:
        {{- if .Values.certManager.enable }}
        cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "upgrade-toolkit.resourceName" (dict "suffix" "serving-cert" "context" $) }}
        {{- end }}
    name: {{ include "upgrade-toolkit.resourceName" (dict "suffix" "mutating-webhook-configuration" "context" $) }}
webhooks:
    - admissionReviewVersions:
        - v1
      clientConfig:
        service:
            name: {{ include "upgrade-toolkit.resourceName" (dict "suffix" "webhook-service" "context" $) }}
            namespace: {{ .Release.Namespace }}
            path: /mutate-management-harvesterhci-io-v1beta1-upgradeplan
      failurePolicy: Fail
      name: mupgradeplan-v1beta1.kb.io
      rules:
        - apiGroups:
            - management.harvesterhci.io
          apiVersions:
            - v1beta1
          operations:
            - CREATE
            - UPDATE
          resources:
            - upgradeplans
      sideEffects: None
{{- end }}
