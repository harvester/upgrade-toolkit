# This rule is not used by the project upgrade-toolkit itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the management.harvesterhci.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: upgrade-toolkit
    app.kubernetes.io/managed-by: kustomize
  name: upgradelog-editor-role
rules:
- apiGroups:
  - management.harvesterhci.io
  resources:
  - upgradelogs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - management.harvesterhci.io
  resources:
  - upgradelogs/status
  verbs:
  - get
