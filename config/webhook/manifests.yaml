---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-management-harvesterhci-io-v1beta1-upgradeplan
  failurePolicy: Fail
  name: mupgradeplan-v1beta1.kb.io
  rules:
  - apiGroups:
    - management.harvesterhci.io
    apiVersions:
    - v1beta1
    operations:
    - CREATE
    - UPDATE
    resources:
    - upgradeplans
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-management-harvesterhci-io-v1beta1-upgradeplan
  failurePolicy: Fail
  name: vupgradeplan-v1beta1.kb.io
  rules:
  - apiGroups:
    - management.harvesterhci.io
    apiVersions:
    - v1beta1
    operations:
    - CREATE
    - UPDATE
    resources:
    - upgradeplans
  sideEffects: None
