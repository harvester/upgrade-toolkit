syntax = "proto3";

package logshipper;

option go_package = "github.com/harvester/upgrade-toolkit/pkg/logshipper/proto";

// LogCollector receives log streams from sidecar log-shipper containers.
service LogCollector {
  // StreamLogs accepts a stream of log entries from a single pod and
  // returns a summary response when the stream ends.
  rpc StreamLogs(stream LogEntry) returns (StreamLogsResponse);
}

// LogEntry represents a single log line with metadata.
message LogEntry {
  string pod_name = 1;
  string pod_namespace = 2;
  // component identifies the upgrade component (e.g., cluster-upgrade, node-upgrade, image-preload).
  string component = 3;
  string node = 4;
  bytes line = 5;
  int64 timestamp_unix_nano = 6;
}

// StreamLogsResponse is returned when the client-side stream ends.
message StreamLogsResponse {
  int64 bytes_received = 1;
}
