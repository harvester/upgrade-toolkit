name: Build Image

on:
  workflow_call:
    inputs:
      push:
        description: Whether to push the image to Docker Hub
        required: true
        type: boolean
      tags:
        description: Image tags (newline-separated) for docker/build-push-action
        required: true
        type: string
      version:
        description: Version string injected into the binary via build arg
        required: true
        type: string
      git_commit:
        description: Git commit SHA injected into the binary via build arg
        required: true
        type: string
      platforms:
        description: Target platforms for the image build
        required: false
        type: string
        default: linux/amd64,linux/arm64

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build container image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read Docker Hub credentials
        if: ${{ inputs.push }}
        uses: rancher-eio/read-vault-secrets@main
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/dockerhub/rancher/credentials username | DOCKER_USERNAME ;
            secret/data/github/repo/${{ github.repository }}/dockerhub/rancher/credentials password | DOCKER_PASSWORD

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ inputs.tags }}
          build-args: |
            VERSION=${{ inputs.version }}
            GIT_COMMIT=${{ inputs.git_commit }}
            GIT_TREE_STATE=clean
          no-cache-filters: addons_generator
          cache-from: type=gha
          cache-to: type=gha,mode=max
