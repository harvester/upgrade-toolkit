name: Build Image

on:
  workflow_call:
    inputs:
      push:
        description: Whether to push the image to Docker Hub
        required: true
        type: boolean
      tags:
        description: Image tags (newline-separated) for docker/build-push-action
        required: true
        type: string
      version:
        description: Version string injected into the binary via build arg
        required: true
        type: string
      git_commit:
        description: Git commit SHA injected into the binary via build arg
        required: true
        type: string
      platforms:
        description: Target platforms for the image build
        required: false
        type: string
        default: linux/amd64,linux/arm64

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build container image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Read Docker Hub credentials
        if: ${{ inputs.push }}
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/dockerhub/rancher/credentials username | DOCKER_USERNAME ;
            secret/data/github/repo/${{ github.repository }}/dockerhub/rancher/credentials password | DOCKER_PASSWORD

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ inputs.tags }}
          build-args: |
            VERSION=${{ inputs.version }}
            GIT_COMMIT=${{ inputs.git_commit }}
            GIT_TREE_STATE=clean
          no-cache-filters: addons_generator
          cache-from: type=gha
          cache-to: type=gha,mode=max
